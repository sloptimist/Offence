# Persistent Start9 Pages main-volume include: nginx/conf.d/offence-api.conf.
# Keep the Offence page on its existing Pages port and Filebrowser folder.
# TEMPLATE ONLY: replace the loopback upstream with your verified private Offence origin.
# Verify the upstream after any package networking change.
server {
    listen 8001;
    listen [::]:8001;
    server_name offence.ai;
    absolute_redirect off;
    root /mnt/filebrowser/Offence;
    index index.html index.htm;
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host offence.ai;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        expires off;
        gzip off;
        brotli off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host offence.ai;
        proxy_cache off;
        expires off;
    }
}
